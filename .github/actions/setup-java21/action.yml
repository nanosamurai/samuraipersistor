name: Set up verified Java 21
description: Install the reviewed Linux x64 Temurin JDK used by the container builder
runs:
  using: composite
  steps:
    - name: Download and verify Temurin
      shell: bash
      run: |
        curl --fail --location --proto '=https' --tlsv1.2 \
          'https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.13.1%2B2/OpenJDK21U-jdk_x64_linux_hotspot_21.0.13.1_2.tar.gz' \
          --output "${RUNNER_TEMP}/temurin21.tar.gz"
        printf '%s  %s\n' \
          'bb8a93f9ae6e7a693b2b721e85dbeff26ae1a77447985a8d7afcdd9c7cf6222e' \
          "${RUNNER_TEMP}/temurin21.tar.gz" | sha256sum --check --strict
    - uses: actions/setup-java@v4
      with:
        distribution: jdkfile
        # Adoptium's SemVer form of 21.0.13.1+2-LTS.
        java-version: '21.0.13+100000002.0.LTS'
        jdkFile: ${{ runner.temp }}/temurin21.tar.gz
    - name: Verify installed build
      shell: bash
      run: java --version | grep -F '21.0.13.1+2'
