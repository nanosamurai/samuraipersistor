name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Clojure tests (PR gate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: 1.12.4.1582

      - name: Cache Clojure/Maven deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.cpcache
          key: clj-${{ runner.os }}-${{ hashFiles('deps.edn') }}

      - name: Prep deps
        run: clojure -P

      - name: Compile vendored Java sources
        run: clojure -T:build compile-java

      - name: Run tests
        run: clojure -X:test

  docker-build:
    name: Docker build (smoke)
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker build
        run: docker build -t samuraipersistor:ci .