name: Publish image (ECR)

on:
  push:
    branches:
      - master

# Needed for GitHub OIDC.
permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
  ECR_REPO: samuraipersistor

jobs:
  publish:
    name: Build + push image to ECR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build
        run: |
          docker build \
            -t "${ECR_REGISTRY}/${ECR_REPO}:sha-${GITHUB_SHA}" \
            .

      - name: Push
        run: |
          docker push "${ECR_REGISTRY}/${ECR_REPO}:sha-${GITHUB_SHA}"

      - name: Summary
        run: |
          echo "Pushed: ${ECR_REGISTRY}/${ECR_REPO}:sha-${GITHUB_SHA}" >> $GITHUB_STEP_SUMMARY