name: Publish image (GHCR)

on:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: Test gate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  secret-scan:
    name: Gitleaks gate
    uses: ./.github/workflows/gitleaks.yml
    permissions:
      contents: read

  publish:
    name: Build + push image to GHCR
    needs:
      - tests
      - secret-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: |
          docker build \
            -t "ghcr.io/nanosamurai/samuraipersistor:sha-${GITHUB_SHA}" \
            .

      - name: Push
        run: |
          docker push "ghcr.io/nanosamurai/samuraipersistor:sha-${GITHUB_SHA}"

      - name: Summary
        run: |
          echo "Pushed: ghcr.io/nanosamurai/samuraipersistor:sha-${GITHUB_SHA}" >> $GITHUB_STEP_SUMMARY
